name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set GitHub Pages base path
        run: |
          base_path="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"$base_path\" />|" src/FormationGhApi.Web/wwwroot/index.html

      - name: Publish Blazor WebAssembly app
        run: dotnet publish src/FormationGhApi.Web/FormationGhApi.Web.csproj --configuration Release --output "${{ runner.temp }}/publish"

      - name: Prepare GitHub Pages files
        run: |
          site_dir="${{ runner.temp }}/publish/wwwroot"
          cp "$site_dir/index.html" "$site_dir/404.html"
          touch "$site_dir/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
