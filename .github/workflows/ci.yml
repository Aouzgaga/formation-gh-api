name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore FormationGhApi.slnx

      - name: Build
        run: dotnet build FormationGhApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FormationGhApi.slnx --configuration Release --no-build
